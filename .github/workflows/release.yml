name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ACTIONS_RUNNER_FORCE_NODE24: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Apple Silicon Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build macOS Binary (ARM64 / Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Rename Binary
        run: mv target/aarch64-apple-darwin/release/your_app app-macos-arm64
        shell: bash

      - name: Upload Binary via GitHub CLI
        run: gh release upload ${{ github.ref_name }} app-macos-arm64 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
