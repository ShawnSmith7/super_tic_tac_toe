name: Multi-Platform Rust Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build & Archive Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: super_tic_tac_toe-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: super_tic_tac_toe-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: super_tic_tac_toe-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Package Linux / macOS into .tar.gz
      - name: Compress Archive (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/super_tic_tac_toe .
          tar -czf ${{ matrix.archive_name }} super_tic_tac_toe README.md LICENSE

      # Package Windows into .zip
      - name: Compress Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item target\${{ matrix.target }}\release\super_tic_tac_toe.exe .
          Compress-Archive -Path super_tic_tac_toe.exe, README.md, LICENSE -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Publish Release with Compressed Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}