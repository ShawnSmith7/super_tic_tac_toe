name: Multi-Platform Rust Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Raw Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_src: super_tic_tac_toe
            asset_name: super_tic_tac_toe-${{ github.ref_name }}-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: super_tic_tac_toe.exe
            asset_name: super_tic_tac_toe-${{ github.ref_name }}-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_src: super_tic_tac_toe
            asset_name: super_tic_tac_toe-${{ github.ref_name }}-macos-amd64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binary File (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_src }} ./${{ matrix.asset_name }}

      - name: Prepare Binary File (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item target\${{ matrix.target }}\release\${{ matrix.binary_src }} .\${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Publish Release with Raw Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}